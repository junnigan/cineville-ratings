<!doctype html>
<meta charset="utf-8">
<title>Cineville Ratings 设置</title>
<style>
  body{font:14px/1.6 system-ui,sans-serif;margin:16px;min-width:340px}
  label{display:block;margin:12px 0 4px;font-weight:600}
  .row{display:flex;gap:8px;align-items:center}
  .row label{margin:0}
  small{color:#666;display:block;margin-top:2px}
  select,input[type=text]{width:100%;padding:4px;box-sizing:border-box}
  #saved{color:#2e963d;margin-top:12px;height:1em}
</style>
<h3>Cineville Ratings</h3>

<div class="row"><input type="checkbox" id="translate"><label for="translate">显示官方译名</label></div>
<label for="lang">目标语言</label>
<select id="lang">
  <option value="zh-cn">简体中文</option>
  <option value="zh-tw">繁體中文</option>
  <option value="en">English</option>
  <option value="ja">日本語</option>
  <option value="ko">한국어</option>
  <option value="fr">Français</option>
  <option value="de">Deutsch</option>
  <option value="es">Español</option>
  <option value="nl">Nederlands</option>
</select>
<small>译名来自 NeoDB 收录的各地区官方片名,例如 Léon → 这个杀手不太冷。没有收录的语言则不显示。</small>

<div class="row" style="margin-top:12px"><input type="checkbox" id="showComments"><label for="showComments">详情页显示短评</label></div>

<label for="omdbKey">OMDb API Key(可选)</label>
<input type="text" id="omdbKey" placeholder="用于获取 IMDb 评分">
<small>IMDb 会拦截直接抓取。到 omdbapi.com 免费申请 key 后填在这里。</small>

<div id="saved"></div>
<script src="options.js"></script>
